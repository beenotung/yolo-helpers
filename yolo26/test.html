<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YOLO26 Detection Test</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        color: #1e293b;
        background: #f7f8fb;
      }

      main {
        width: min(1120px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 24px 0 32px;
      }

      header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 16px;
      }

      h1 {
        margin: 0;
        font-size: 24px;
        line-height: 1.2;
      }

      .status {
        min-height: 22px;
        color: #475569;
        font-size: 14px;
        text-align: right;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        padding: 12px;
        margin-bottom: 16px;
        background: #ffffff;
        border: 1px solid #dbe2ea;
        border-radius: 8px;
      }

      label {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        color: #334155;
      }

      input[type="number"] {
        width: 78px;
        padding: 7px 8px;
        color: #1e293b;
        background: #ffffff;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
      }

      input[type="file"] {
        max-width: 320px;
      }

      button {
        padding: 8px 12px;
        color: #ffffff;
        background: #2563eb;
        border: 0;
        border-radius: 6px;
        cursor: pointer;
      }

      button:disabled {
        cursor: not-allowed;
        background: #94a3b8;
      }

      .stage {
        display: grid;
        place-items: center;
        min-height: 420px;
        overflow: auto;
        background: #ffffff;
        border: 1px solid #dbe2ea;
        border-radius: 8px;
      }

      canvas {
        display: block;
        max-width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>YOLO26 Detection Test</h1>
        <div id="status" class="status">Loading model...</div>
      </header>

      <div class="toolbar">
        <label>
          Image
          <input id="file" type="file" accept="image/*" />
        </label>
        <label>
          Score
          <input id="scoreThreshold" type="number" min="0" max="1" step="0.05" value="0.25" />
        </label>
        <label>
          IOU
          <input id="iouThreshold" type="number" min="0" max="1" step="0.05" value="0.45" />
        </label>
        <button id="run" disabled>Run Detection</button>
      </div>

      <div class="stage">
        <canvas id="canvas" width="640" height="640"></canvas>
      </div>
    </main>

    <script src="./test.js"></script>
  </body>
</html>
