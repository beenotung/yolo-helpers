<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YOLO Helpers Test All</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        color: #1f2937;
        background: #f6f8fb;
      }

      main {
        width: min(1180px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 24px 0 32px;
      }

      header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 16px;
      }

      h1 {
        margin: 0;
        font-size: 24px;
        line-height: 1.2;
      }

      .status {
        max-width: 560px;
        min-height: 22px;
        color: #475569;
        font-size: 14px;
        text-align: right;
      }

      .toolbar {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 12px;
        padding: 12px;
        margin-bottom: 16px;
        background: #ffffff;
        border: 1px solid #dbe2ea;
        border-radius: 8px;
      }

      label {
        display: grid;
        gap: 6px;
        min-width: 0;
        font-size: 12px;
        color: #475569;
      }

      label.wide {
        grid-column: span 2;
      }

      input,
      select,
      button {
        min-width: 0;
        height: 36px;
        box-sizing: border-box;
        border-radius: 6px;
        font: inherit;
      }

      input,
      select {
        padding: 0 9px;
        color: #1e293b;
        background: #ffffff;
        border: 1px solid #cbd5e1;
      }

      button {
        align-self: end;
        padding: 0 12px;
        color: #ffffff;
        background: #2563eb;
        border: 0;
        cursor: pointer;
      }

      button:disabled {
        cursor: not-allowed;
        background: #94a3b8;
      }

      .content {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 320px;
        gap: 16px;
      }

      .stage,
      .side {
        background: #ffffff;
        border: 1px solid #dbe2ea;
        border-radius: 8px;
      }

      .stage {
        display: grid;
        place-items: center;
        min-height: 520px;
        overflow: auto;
      }

      .side {
        padding: 12px;
        overflow: auto;
      }

      canvas {
        display: block;
        max-width: 100%;
        height: auto;
      }

      pre {
        white-space: pre-wrap;
        word-break: break-word;
        margin: 0 0 12px;
        font-size: 12px;
      }

      ol {
        margin: 0;
        padding-left: 20px;
        font-size: 13px;
      }

      @media (max-width: 900px) {
        .toolbar,
        .content {
          grid-template-columns: 1fr;
        }

        label.wide {
          grid-column: auto;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>YOLO Helpers Test All</h1>
        <div id="status" class="status">Ready</div>
      </header>

      <div class="toolbar">
        <label>
          Task
          <select id="task">
            <option value="detect">detect</option>
            <option value="classify">classify</option>
            <option value="pose">pose</option>
            <option value="segment">segment</option>
          </select>
        </label>
        <label class="wide">
          Model path
          <input id="modelUrl" value="models/yolo26n_web_model" />
        </label>
        <label>
          Image
          <input id="file" type="file" accept="image/*" />
        </label>
        <label>
          Score
          <input id="scoreThreshold" type="number" min="0" max="1" step="0.05" value="0.25" />
        </label>
        <label>
          IOU
          <input id="iouThreshold" type="number" min="0" max="1" step="0.05" value="0.45" />
        </label>
        <label>
          Max boxes
          <input id="maxOutputSize" type="number" min="1" step="1" value="50" />
        </label>
        <label>
          Classes
          <input id="numClasses" type="number" min="1" step="1" placeholder="auto" />
        </label>
        <label>
          Keypoints
          <input id="numKeypoints" type="number" min="1" step="1" placeholder="auto" />
        </label>
        <label>
          Channels
          <input id="numChannels" type="number" min="1" step="1" placeholder="32" />
        </label>
        <label>
          Output format
          <select id="outputFormat">
            <option value="auto">auto</option>
            <option value="yolo">yolo</option>
            <option value="yolo26">yolo26</option>
            <option value="end2end">end2end</option>
          </select>
        </label>
        <button id="load">Load Model</button>
        <button id="run" disabled>Run</button>
      </div>

      <div class="content">
        <div class="stage">
          <canvas id="canvas" width="640" height="640"></canvas>
        </div>
        <aside class="side">
          <pre id="metadata">No model loaded.</pre>
          <ol id="results"></ol>
        </aside>
      </div>
    </main>

    <script src="./test-all.js"></script>
  </body>
</html>
